# Default run configuration. Override with -Dkey=value or KEY env vars (dots -> underscores).
browser=chrome
headless=true
# Selenium Grid endpoint, e.g. http://localhost:4444 (blank = local browser)
remote.url=
# Optional explicit browser binary; blank lets Selenium Manager locate Chrome
chrome.binary=
# Embedded demo app: bind address, host name the browser should use, port (0 = random)
app.bind=127.0.0.1
app.host=localhost
app.port=0
wait.explicit.seconds=10
wait.pageload.seconds=30
window.width=1366
window.height=900
